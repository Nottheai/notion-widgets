<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Old+Mincho:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .panel { display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 10px 16px; }
  .top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 0 12px; }
  .lab { font-size: 14px; color: var(--ink-soft); }
  #pct { font-family: "Zen Old Mincho", serif; font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }
  #path { width: 100%; height: 46px; display: block; }
  .foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 12px; font-size: 13px; color: var(--ink-soft); }
  .walker { animation: bob .7s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-1.5px); } }
  .sway { animation: sway 3s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
  @keyframes sway { 50% { transform: rotate(6deg); } }
</style>
</head>
<body>
<div class="panel">
  <div class="top"><span class="lab">the long walk · life journey</span><span id="pct">—</span></div>
  <svg id="path" preserveAspectRatio="none"></svg>
  <div class="foot"><span id="left"></span><span id="right"></span></div>
</div>
<script>
const q = new URLSearchParams(location.search);
const born = q.get("born"), years = parseFloat(q.get("years") || "90");
const DAY = 86400000, NS = "http://www.w3.org/2000/svg";
const start = born ? new Date(born + "T00:00:00").getTime() : NaN;
const end = new Date(start); if (!isNaN(start)) end.setFullYear(end.getFullYear() + Math.floor(years));
const endMs = end.getTime() + (years % 1) * 365.2425 * DAY;
const svg = document.getElementById("path");
let W = 0, deco = [];
function rand(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function layout() {
  W = svg.clientWidth; svg.setAttribute("viewBox", `0 0 ${W} 46`);
  const r = rand(7); deco = [];
  for (let x = 6; x < W - 6; x += 9 + r() * 10) deco.push({ x, k: r(), c: ["#e39b94", "#f2c46d", "#ffffff", "#c9a3d6"][Math.floor(r() * 4)] });
}
const pathY = x => 30 + Math.sin(x / 55) * 4;
function draw(f) {
  const px = 10 + f * (W - 20);
  let d = `M0 ${pathY(0)}`; for (let x = 0; x <= W; x += 6) d += ` L${x} ${pathY(x).toFixed(1)}`;
  let s = `<path d="${d}" stroke="#d8c39a" stroke-width="7" fill="none" stroke-linecap="round"/>`;
  s += `<path d="${d}" stroke="#c4ad80" stroke-width="1" fill="none" stroke-dasharray="2 5" opacity=".7"/>`;
  for (const p of deco) {
    const y = pathY(p.x) + (p.k > .5 ? 7 : -8);
    if (p.x < px) { // flowers bloom where you've walked
      s += `<g class="sway" style="animation-delay:${-p.k * 3}s"><line x1="${p.x}" y1="${y + 5}" x2="${p.x}" y2="${y}" stroke="#6f9a55" stroke-width="1.2"/>
            <circle cx="${p.x}" cy="${y}" r="2.4" fill="${p.c}"/><circle cx="${p.x}" cy="${y}" r=".9" fill="#f2c46d"/></g>`;
    } else {
      s += `<path class="sway" style="animation-delay:${-p.k * 3}s" d="M${p.x - 2} ${y + 5} Q${p.x - 1} ${y} ${p.x - 3} ${y - 2} M${p.x} ${y + 5} Q${p.x + 1} ${y - 1} ${p.x + 1} ${y - 3} M${p.x + 2} ${y + 5} Q${p.x + 3} ${y + 1} ${p.x + 4} ${y}" stroke="#8fb069" stroke-width="1.2" fill="none"/>`;
    }
  }
  // a small tree at the far end
  s += `<g transform="translate(${W - 12},${pathY(W) - 22})"><rect x="-1.5" y="10" width="3" height="10" fill="#8a6a48"/><circle cx="0" cy="6" r="9" fill="#6f9a55"/><circle cx="-5" cy="9" r="6" fill="#7fa75f"/><circle cx="5" cy="9" r="6" fill="#5e8a4a"/></g>`;
  if (!isNaN(start)) { // the little traveller
    const y = pathY(px);
    s += `<g class="walker" transform="translate(${px},${y - 16})">
      <line x1="0" y1="11" x2="-2.5" y2="16" stroke="#4a4237" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="0" y1="11" x2="2.5" y2="16" stroke="#4a4237" stroke-width="1.6" stroke-linecap="round"/>
      <rect x="-3" y="4" width="6" height="8" rx="2.5" fill="#7fa6c9"/>
      <circle cx="0" cy="2" r="3.2" fill="#f1d3b3"/><path d="M-4 0.5 Q0 -4 4 0.5Z" fill="#c9584c"/>
      <line x1="4" y1="6" x2="7" y2="15" stroke="#8a6a48" stroke-width="1.2" stroke-linecap="round"/></g>`;
  }
  svg.innerHTML = s;
}
let lastDraw = 0;
function tick() {
  const resized = svg.clientWidth !== W; if (resized) layout();
  const now = Date.now();
  const redraw = resized || now - lastDraw > 60000; // redraw rarely so the sway/bob animations keep running
  if (isNaN(start)) {
    pct.textContent = "SET BIRTHDAY";
    left.textContent = "add ?born=YYYY-MM-DD to the link";
    if (redraw) { draw(0); lastDraw = now; } return;
  }
  const f = Math.min(1, Math.max(0, (now - start) / (endMs - start)));
  pct.textContent = (f * 100).toFixed(6) + "%";
  left.textContent = `day ${Math.floor((now - start) / DAY).toLocaleString("en-AU")} · age ${((now - start) / (365.2425 * DAY)).toFixed(2)}`;
  right.textContent = "one step at a time";
  if (redraw) { draw(f); lastDraw = now; }
}
tick(); setInterval(tick, 200); addEventListener("resize", tick);
</script>
</body>
</html>
