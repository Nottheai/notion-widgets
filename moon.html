<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moon Phase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Old+Mincho:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .panel { background: radial-gradient(ellipse at 50% 120%, #4b5d86 0%, transparent 60%), linear-gradient(180deg, #1e2a4d, #34436c);
           color: #f6efd9; display: flex; align-items: center; gap: 16px; padding: 14px 20px; }
  .panel::after { opacity: .28; mix-blend-mode: soft-light; }
  #sky { position: absolute; inset: 0; width: 100%; height: 100%; }
  #moon { width: 120px; height: 120px; flex: none; position: relative; z-index: 1; }
  .info { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .lab { font-size: 13px; opacity: .75; }
  #name { font-family: "Zen Old Mincho", serif; font-weight: 700; font-size: 26px; line-height: 1.15; }
  #illum { font-size: 16px; color: #e9dca8; }
  #next { font-size: 14px; opacity: .8; }
  .tw { animation: tw 3s ease-in-out infinite; }
  @keyframes tw { 50% { opacity: .2; } }
  .fly { animation: fly 9s ease-in-out infinite; }
  @keyframes fly { 25% { transform: translate(14px,-10px); opacity: 1; } 50% { transform: translate(-6px,-18px); opacity: .2; } 75% { transform: translate(-14px,-4px); opacity: .9; } }
  @media (max-width: 380px) {
    .panel { flex-direction: column; justify-content: center; text-align: center; gap: 8px; }
    .info { align-items: center; }
  }
</style>
</head>
<body>
<div class="panel">
  <svg id="sky" preserveAspectRatio="none"></svg>
  <svg id="moon" viewBox="0 0 120 120">
    <defs>
      <radialGradient id="halo"><stop offset=".45" stop-color="#fff6d6" stop-opacity=".35"/><stop offset="1" stop-color="#fff6d6" stop-opacity="0"/></radialGradient>
      <radialGradient id="lit" cx=".45" cy=".4"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#eadfb8"/></radialGradient>
      <filter id="blur"><feGaussianBlur stdDeviation=".8"/></filter>
      <clipPath id="litClip"><path id="litPath"/></clipPath>
    </defs>
    <circle cx="60" cy="60" r="58" fill="url(#halo)" id="haloC"/>
    <circle cx="60" cy="60" r="38" fill="#3f4d73" stroke="#56658e" stroke-width="1"/>
    <g filter="url(#blur)">
      <path id="litShape" fill="url(#lit)"/>
      <g clip-path="url(#litClip)" fill="#cbbd92" opacity=".45">
        <circle cx="48" cy="48" r="7"/><circle cx="72" cy="66" r="9"/><circle cx="56" cy="78" r="4"/><circle cx="76" cy="42" r="4"/><circle cx="40" cy="68" r="5"/>
      </g>
    </g>
  </svg>
  <div class="info">
    <span class="lab">tonight's moon · southern sky</span>
    <span id="name">—</span>
    <span id="illum"></span>
    <span id="next"></span>
  </div>
</div>
<script>
const SYN = 29.530588853, DAY = 86400000, REF = Date.UTC(2000, 0, 6, 18, 14);
const SOUTH = true;
const NS = "http://www.w3.org/2000/svg";
function phase(now = Date.now()) {
  const age = (((now - REF) / DAY) % SYN + SYN) % SYN;
  const illum = (1 - Math.cos(2 * Math.PI * age / SYN)) / 2;
  const names = [[1.84, "New Moon"], [5.53, "Waxing Crescent"], [9.22, "First Quarter"], [12.91, "Waxing Gibbous"],
                 [16.61, "Full Moon"], [20.30, "Waning Gibbous"], [23.99, "Last Quarter"], [27.68, "Waning Crescent"], [99, "New Moon"]];
  return { age, illum, name: names.find(n => age < n[0])[1], toFull: ((SYN / 2 - age) + SYN) % SYN };
}
function litPath(age) {
  const R = 38, cx = 60, cy = 60, k = Math.cos(2 * Math.PI * age / SYN), rx = Math.abs(k) * R;
  const waxing = age < SYN / 2;
  let right = waxing; if (SOUTH) right = !right;       // which side is lit
  const crescent = k > 0;                               // less than half lit
  const top = `${cx},${cy - R}`, bot = `${cx},${cy + R}`;
  const outer = right ? 1 : 0;                          // top → bottom along lit edge
  const term = right ? (crescent ? 0 : 1) : (crescent ? 1 : 0);
  return `M${top} A${R},${R} 0 0 ${outer} ${bot} A${rx.toFixed(2)},${R} 0 0 ${term} ${top}Z`;
}
function render() {
  const p = phase(), d = litPath(p.age);
  litShape.setAttribute("d", d); litPath_.setAttribute("d", d);
  haloC.setAttribute("opacity", (.3 + p.illum * .7).toFixed(2));
  document.getElementById("name").textContent = p.name;
  illum.textContent = `${Math.round(p.illum * 100)}% lit`;
  next.textContent = p.name === "Full Moon" ? "It's full tonight — go look outside" :
    `Full moon in ${p.toFull < 1.5 ? "1 day" : Math.round(p.toFull) + " days"}`;
}
const litPath_ = document.getElementById("litPath");
const sky = document.getElementById("sky");
function stars() {
  const w = sky.clientWidth, h = sky.clientHeight; sky.setAttribute("viewBox", `0 0 ${w} ${h}`); sky.innerHTML = "";
  for (let i = 0; i < Math.floor(w * h / 1400); i++) {
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", Math.random() * w); c.setAttribute("cy", Math.random() * h); c.setAttribute("r", Math.random() * .9 + .4);
    c.setAttribute("fill", "#fff8de"); c.setAttribute("class", "tw"); c.style.animationDelay = -Math.random() * 3 + "s"; c.style.animationDuration = 2 + Math.random() * 3 + "s";
    sky.appendChild(c);
  }
  for (let i = 0; i < 5; i++) { // fireflies
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", Math.random() * w); c.setAttribute("cy", h * (.6 + Math.random() * .35)); c.setAttribute("r", 1.8);
    c.setAttribute("fill", "#f5e58c"); c.setAttribute("class", "fly"); c.style.filter = "drop-shadow(0 0 3px #f5e58c)";
    c.style.animationDelay = -Math.random() * 9 + "s"; sky.appendChild(c);
  }
}
render(); stars(); setInterval(render, 60000); addEventListener("resize", stars);
</script>
</body>
</html>
