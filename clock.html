<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melbourne Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Old+Mincho:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .panel { background: none; }
  svg#scene { position: absolute; inset: 0; width: 100%; height: 100%; }
  .face { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2;
          color: #fffaf0; text-shadow: 0 1px 2px rgba(60,50,40,.35), 0 0 18px rgba(255,250,240,.35); padding-bottom: 14%; }
  #time { font-family: "Zen Old Mincho", serif; font-weight: 700; font-size: clamp(30px, 17vw, 64px); line-height: 1; letter-spacing: 1px; }
  #time .colon { animation: breathe 2s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .35; } }
  #sec { font-size: .38em; opacity: .85; margin-left: 4px; }
  #date { font-size: clamp(12px, 5vw, 17px); margin-top: 6px; letter-spacing: 1px; }
  .cloud { animation: drift linear infinite; }
  @keyframes drift { from { transform: translateX(-160px); } to { transform: translateX(560px); } }
</style>
</head>
<body>
<div class="panel">
  <svg id="scene" viewBox="0 0 400 220" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop id="skyTop" offset="0" stop-color="#7fb6db"/>
        <stop id="skyBot" offset="1" stop-color="#d8ecf2"/>
      </linearGradient>
      <radialGradient id="sunGlow"><stop offset="0" stop-color="#fff3c8" stop-opacity=".95"/><stop offset=".35" stop-color="#f6d38a" stop-opacity=".7"/><stop offset="1" stop-color="#f6d38a" stop-opacity="0"/></radialGradient>
      <radialGradient id="moonGlow"><stop offset="0" stop-color="#fffbe8" stop-opacity=".9"/><stop offset=".3" stop-color="#e9e6d0" stop-opacity=".35"/><stop offset="1" stop-color="#e9e6d0" stop-opacity="0"/></radialGradient>
      <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
      <symbol id="cl" viewBox="0 0 120 50"><g fill="#fffaf0"><ellipse cx="60" cy="34" rx="56" ry="14"/><circle cx="40" cy="26" r="16"/><circle cx="64" cy="20" r="20"/><circle cx="86" cy="28" r="13"/></g></symbol>
    </defs>
    <rect width="400" height="220" fill="url(#sky)"/>
    <g id="stars"></g>
    <g id="orbit"><circle id="glow" cx="0" cy="0" r="46" fill="url(#sunGlow)"/><circle id="orb" cx="0" cy="0" r="13" fill="#fff1c4"/></g>
    <g id="clouds" filter="url(#soft)" opacity=".92">
      <use href="#cl" class="cloud" x="0" y="24" width="120" height="50" style="animation-duration:140s;animation-delay:-30s"/>
      <use href="#cl" class="cloud" x="0" y="58" width="80" height="34" style="animation-duration:190s;animation-delay:-120s;opacity:.8"/>
      <use href="#cl" class="cloud" x="0" y="10" width="64" height="27" style="animation-duration:230s;animation-delay:-60s;opacity:.7"/>
    </g>
    <path id="h1" d="M0 170 C70 140 130 150 200 160 S330 135 400 150 V220 H0Z" fill="#9dbf7a"/>
    <path id="h2" d="M0 185 C90 165 160 190 250 178 S360 170 400 182 V220 H0Z" fill="#7fa75f"/>
    <path id="h3" d="M0 205 C80 192 170 206 260 198 S360 196 400 202 V220 H0Z" fill="#5e8a4a"/>
    <rect id="shade" width="400" height="220" fill="#1c2546" opacity="0"/>
  </svg>
  <div class="face">
    <div id="time"><span id="hh">--</span><span class="colon">:</span><span id="mm">--</span><span id="sec">--</span></div>
    <div id="date" class="hand">—</div>
  </div>
</div>
<script>
const TZ = "Australia/Melbourne";
const KEYS = [ // hour, sky top, sky bottom, night shade
  [0, "#1d2a4a", "#3d4f73", .45], [4.5, "#25325a", "#55628a", .4], [6, "#6f86b0", "#f2c3a6", .15],
  [7.5, "#8fbfdc", "#f6dcc0", 0], [12, "#7fb6db", "#d8ecf2", 0], [17, "#8ab3d1", "#f3d9b0", 0],
  [19, "#7277a4", "#f2a887", .1], [20.5, "#33406a", "#7b7aa0", .3], [22, "#1f2c4e", "#3f5078", .42], [24, "#1d2a4a", "#3d4f73", .45]];
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => "rgb(" + hex(a).map((v, i) => Math.round(v + (hex(b)[i] - v) * t)).join(",") + ")";
const stars = document.getElementById("stars");
for (let i = 0; i < 40; i++) {
  const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  c.setAttribute("cx", Math.random() * 400); c.setAttribute("cy", Math.random() * 130); c.setAttribute("r", Math.random() * .9 + .3);
  c.setAttribute("fill", "#fffbe8"); c.style.animation = `breathe ${2 + Math.random() * 3}s ease-in-out ${-Math.random() * 4}s infinite`;
  stars.appendChild(c);
}
const fmt = new Intl.DateTimeFormat("en-AU", { timeZone: TZ, hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" });
const dfmt = new Intl.DateTimeFormat("en-AU", { timeZone: TZ, weekday: "long", day: "numeric", month: "long" });
function tick() {
  const now = new Date();
  const p = Object.fromEntries(fmt.formatToParts(now).map(x => [x.type, x.value]));
  hh.textContent = p.hour; mm.textContent = p.minute; sec.textContent = p.second;
  document.getElementById("date").textContent = dfmt.format(now) + " · Melbourne";
  const h = +p.hour + p.minute / 60 + p.second / 3600;
  let i = KEYS.findIndex(k => k[0] > h) - 1; if (i < 0) i = 0;
  const [h0, t0, b0, s0] = KEYS[i], [h1, t1, b1, s1] = KEYS[i + 1], t = (h - h0) / (h1 - h0);
  skyTop.setAttribute("stop-color", mix(t0, t1, t)); skyBot.setAttribute("stop-color", mix(b0, b1, t));
  shade.setAttribute("opacity", (s0 + (s1 - s0) * t).toFixed(3));
  const day = h >= 5.8 && h <= 19.6;
  const f = day ? (h - 5.8) / 13.8 : ((h + 24 - 19.6) % 24) / 10.2;
  const x = 20 + f * 360, y = 150 - Math.sin(f * Math.PI) * 120;
  orbit.setAttribute("transform", `translate(${x},${y})`);
  glow.setAttribute("fill", day ? "url(#sunGlow)" : "url(#moonGlow)");
  orb.setAttribute("fill", day ? "#fff1c4" : "#f3f0dc"); orb.setAttribute("r", day ? 13 : 10);
  stars.setAttribute("opacity", day ? Math.max(0, 1 - Math.min(h - 5.8, 19.6 - h) * 1.5).toFixed(2) : 1);
}
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
