<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meadow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Old+Mincho:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .panel { cursor: pointer; background: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hint { position: absolute; top: 6px; right: 12px; z-index: 2; font-size: 12px; color: var(--ink-soft); opacity: .85; }
</style>
</head>
<body>
<div class="panel">
  <canvas id="c"></canvas>
  <span class="hint">tap to drop a berry</span>
</div>
<script>
const cv = document.getElementById("c"), g = cv.getContext("2d");
let W, H, G, S, blades = [], clouds = [], seeds = [];
const rnd = (a, b) => a + Math.random() * (b - a);
const INK = "#5a4a3a";
function resize() {
  const dpr = devicePixelRatio || 1, r = cv.getBoundingClientRect();
  W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
  G = H * .82; S = Math.max(.6, Math.min(1.3, H / 120));
  blades = Array.from({ length: Math.floor(W / 4) }, () => ({ x: rnd(0, W), h: rnd(5, 13) * S, p: rnd(0, 6), c: Math.random() < .5 ? "#7fa75f" : "#6f9a55" }));
  clouds = Array.from({ length: 3 }, (_, i) => ({ x: rnd(0, W), y: rnd(.08, .3) * H, s: rnd(.6, 1.1) * S, v: rnd(3, 7) }));
  seeds = Array.from({ length: 4 }, () => ({ x: rnd(0, W), y: rnd(.2, .6) * H, p: rnd(0, 6) }));
}
function ell(x, y, rx, ry, fill, rot = 0) { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); g.fillStyle = fill; g.fill(); g.lineWidth = 1.1 * S; g.strokeStyle = INK; g.stroke(); }
function dot(x, y, r, c) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fillStyle = c; g.fill(); }
function line(x1, y1, x2, y2, c = INK, w = 1.4) { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.strokeStyle = c; g.lineWidth = w * S; g.lineCap = "round"; g.stroke(); }

function scenery(t) {
  const sky = g.createLinearGradient(0, 0, 0, G);
  sky.addColorStop(0, "#bfdcec"); sky.addColorStop(1, "#f4ecd6");
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  g.save(); g.filter = `blur(${1.5 * S}px)`; g.fillStyle = "#fffaf0";
  for (const c of clouds) {
    c.x += c.v * .016; if (c.x > W + 60) c.x = -60;
    for (const [dx, dy, r] of [[0, 0, 12], [14, -5, 14], [28, 0, 11], [14, 4, 13]]) dot(c.x + dx * c.s, c.y + dy * c.s, r * c.s, "#fffaf0");
  }
  g.restore();
  g.beginPath(); g.moveTo(0, G - 16 * S);
  for (let x = 0; x <= W; x += 10) g.lineTo(x, G - 16 * S - Math.sin(x / 70) * 8 * S);
  g.lineTo(W, H); g.lineTo(0, H); g.fillStyle = "#b7cf94"; g.fill();
  g.fillStyle = "#9cbf72"; g.fillRect(0, G, W, H - G);
  g.beginPath(); g.moveTo(0, G); g.lineTo(W, G); g.strokeStyle = "#86ad62"; g.lineWidth = 1; g.stroke();
}
function grass(t) {
  for (const b of blades) {
    const sway = Math.sin(t / 900 + b.p + b.x / 60) * 3 * S;
    g.beginPath(); g.moveTo(b.x, H); g.quadraticCurveTo(b.x, H - b.h * .6, b.x + sway, H - b.h - (G - H + 14 * S) * 0);
    g.strokeStyle = b.c; g.lineWidth = 1.3; g.stroke();
  }
}
function floaters(t) {
  for (const s of seeds) {
    s.x += .25; s.y += Math.sin(t / 1200 + s.p) * .12; if (s.x > W + 10) { s.x = -10; s.y = rnd(.2, .6) * H; }
    for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2 + t / 2000; line(s.x, s.y, s.x + Math.cos(a) * 3 * S, s.y + Math.sin(a) * 3 * S, "rgba(255,255,255,.9)", .6); }
    line(s.x, s.y, s.x - 2 * S, s.y + 5 * S, "rgba(160,150,130,.8)", .6);
  }
  // butterfly
  const bx = W * .5 + Math.sin(t / 3100) * W * .38, by = H * .42 + Math.sin(t / 900) * 10 * S, f = Math.abs(Math.sin(t / 90));
  for (const sgn of [-1, 1]) ell(bx + sgn * 3 * S * f, by, 3.2 * S * f + .4, 4 * S, "#f2c46d", sgn * .4);
  line(bx, by - 3 * S, bx, by + 3 * S, INK, 1);
}

class Critter {
  constructor(kind, sp) { Object.assign(this, { kind, sp, x: rnd(20, Math.max(30, W - 40)), dir: Math.random() < .5 ? 1 : -1, state: "walk", t: rnd(2, 6), ph: 0, target: null, hop: 0, alert: 0 }); }
  update(dt) {
    this.t -= dt;
    if (this.target != null) {
      this.state = "walk"; this.dir = this.target > this.x ? 1 : -1;
      if (Math.abs(this.target - this.x) < 4 * S) { eat(this); this.target = null; this.state = "idle"; this.t = 2; }
    } else if (this.t <= 0) {
      const opts = this.kind === "cat" ? ["walk", "walk", "idle", "sit", "sleep"] : ["walk", "walk", "idle"];
      this.state = opts[Math.random() * opts.length | 0]; this.t = this.state === "sleep" ? rnd(8, 16) : rnd(2, 7);
      if (Math.random() < .3) this.dir *= -1;
    }
    if (this.state === "walk") {
      this.x += this.dir * this.sp * S * (this.target != null ? 1.8 : 1) * dt; this.ph += dt * (this.kind === "rabbit" ? 6 : 10);
      const m = 18 * S; if (this.x < m) { this.x = m; this.dir = 1; } if (this.x > W - m) { this.x = W - m; this.dir = -1; }
    }
    if (this.kind === "chick" && this.state === "idle" && Math.random() < dt * .7) this.hop = 1;
    this.hop = Math.max(0, this.hop - dt * 3); this.alert = Math.max(0, this.alert - dt);
  }
  draw(t) {
    g.save(); g.translate(this.x, G); g.scale(this.dir * S, S);
    this[this.kind](t); g.restore();
    if (this.alert > 0) { g.font = `${14 * S}px "Klee One"`; g.fillStyle = "#c9584c"; g.fillText("!", this.x - 2, G - 34 * S); }
  }
  cat(t) {
    const w = this.state === "walk" ? Math.sin(this.ph) : 0;
    if (this.state === "sleep") {
      ell(0, -6, 15, 7, "#e8b27a"); ell(10, -6, 7, 6, "#e8b27a");
      g.beginPath(); g.moveTo(7, -11); g.lineTo(9, -16); g.lineTo(11, -11); g.moveTo(12, -11); g.lineTo(15, -15); g.lineTo(15, -9); g.fillStyle = "#e8b27a"; g.fill(); g.stroke();
      line(8, -6, 10, -6, INK, 1); line(12, -6, 14, -6, INK, 1);
      g.save(); g.scale(this.dir, 1); g.font = `${10}px "Klee One"`; g.fillStyle = "#7f9bb8";
      const z = (t / 1000) % 2; g.globalAlpha = 1 - z / 2; g.fillText("z", this.dir * 14 + z * 4, -18 - z * 8); g.restore();
      return;
    }
    const sit = this.state === "sit";
    const tail = Math.sin(t / 500) * 3;
    g.beginPath(); g.moveTo(-12, -14); g.quadraticCurveTo(-22, -18 + tail, -18, -30 + tail); g.strokeStyle = INK; g.lineWidth = 4.2; g.lineCap = "round"; g.stroke();
    g.strokeStyle = "#e8b27a"; g.lineWidth = 2.6; g.stroke();
    if (!sit) for (const [lx, o] of [[-9, w], [-4, -w], [5, -w], [10, w]]) line(lx, -6, lx + o * 2.5, 0, INK, 2.6);
    sit ? ell(-2, -11, 10, 11, "#e8b27a") : ell(0, -12, 14, 8, "#e8b27a");
    g.beginPath(); g.arc(sit ? -2 : 0, sit ? -14 : -14, 6, Math.PI * 1.1, Math.PI * 1.9); g.strokeStyle = "#c98e55"; g.lineWidth = 1.3; g.stroke();
    const hx = sit ? 4 : 13, hy = sit ? -26 : -20;
    g.beginPath(); g.moveTo(hx - 6, hy - 4); g.lineTo(hx - 5, hy - 12); g.lineTo(hx - 1, hy - 7); g.moveTo(hx + 1, hy - 7); g.lineTo(hx + 5, hy - 12); g.lineTo(hx + 6, hy - 4);
    g.fillStyle = "#e8b27a"; g.fill(); g.strokeStyle = INK; g.lineWidth = 1.1; g.stroke();
    ell(hx, hy, 8, 7, "#e8b27a"); dot(hx + 2, hy - 1, 1.1, INK); dot(hx + 6, hy - 1, 1.1, INK); dot(hx + 4.5, hy + 2, 1, "#e39b94");
  }
  rabbit(t) {
    const hop = this.state === "walk" ? Math.abs(Math.sin(this.ph)) * 7 : 0;
    g.translate(0, -hop);
    dot(-11, -9, 3.5, "#ffffff");
    ell(0, -9, 11, 8, "#f4efe6");
    ell(8, -21, 2.5, 8, "#f4efe6", .25); ell(12, -20, 2.5, 8, "#f4efe6", .45);
    ell(10, -14, 7, 6, "#f4efe6"); dot(13, -15, 1.1, INK); dot(16.5, -13, .9, "#e39b94");
    ell(-4, -1, 3.5, 1.8, "#f4efe6"); ell(6, -1, 3.5, 1.8, "#f4efe6");
  }
  chick(t) {
    const w = this.state === "walk" ? Math.sin(this.ph) : 0;
    g.translate(0, -Math.sin(this.hop * Math.PI) * 8);
    line(-2, -3, -2 + w * 1.5, 0, "#d98b4a", 1.4); line(2, -3, 2 - w * 1.5, 0, "#d98b4a", 1.4);
    ell(0, -9, 7, 6.5, "#f2d26b"); ell(-2, -9, 3.5, 2.5, "#e8c255", -.3);
    g.beginPath(); g.moveTo(6, -11); g.lineTo(10, -10); g.lineTo(6, -8.5); g.fillStyle = "#e39a52"; g.fill();
    dot(3.5, -11.5, 1, INK);
  }
}
function runnerDraw(r) {
  const s = Math.sin(r.ph);
  g.save(); g.translate(r.x, G); g.scale(S, S);
  line(0, -14, -7 * s, -5); line(-7 * s, -5, -5 * s - 3, 0);
  line(0, -14, 7 * s, -5); line(7 * s, -5, 5 * s + 3, 0);
  line(1, -24, 1 - 6 * s, -17, "#f1d3b3", 2); line(1, -24, 1 + 6 * s, -17, "#f1d3b3", 2);
  g.beginPath(); g.roundRect(-3.5, -26, 8, 13, 3); g.fillStyle = "#7fa6c9"; g.fill(); g.strokeStyle = INK; g.lineWidth = 1.1; g.stroke();
  g.beginPath(); g.roundRect(-3.5, -15, 8, 4, 1.5); g.fillStyle = "#4a4237"; g.fill();
  ell(1.5, -31, 4.6, 4.8, "#f1d3b3");
  g.beginPath(); g.arc(1.5, -32, 4.8, Math.PI * .95, Math.PI * 2.05); g.fillStyle = "#3b3530"; g.fill();
  line(-3, -32, 6, -32, "#c9584c", 1.8); line(-3, -32, -8, -30 + Math.sin(r.ph * 2) * 1.5, "#c9584c", 1.4);
  g.restore();
}

let crew = [], runner = null, nextRun = rnd(6, 12), berries = [], hearts = [], dust = [];
function eat(c) { berries = berries.filter(b => Math.abs(b.x - c.x) > 8 * S); hearts.push({ x: c.x, y: G - 30 * S, a: 1 }); }
cv.parentElement.addEventListener("click", e => {
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left;
  berries.push({ x, y: 0, vy: 0 });
  const free = crew.filter(c => c.target == null).sort((a, b) => Math.abs(a.x - x) - Math.abs(b.x - x))[0];
  if (free) { free.target = x; if (free.state === "sleep") free.state = "walk"; }
});
let last = performance.now();
function loop(t) {
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  scenery(t); floaters(t);
  for (const b of berries) {
    b.vy += 300 * dt; b.y = Math.min(G - 3 * S, b.y + b.vy * dt);
    dot(b.x, b.y, 3 * S, "#c9584c"); dot(b.x - 1 * S, b.y - 1 * S, 1 * S, "#f4b0a8"); line(b.x, b.y - 3 * S, b.x + 2 * S, b.y - 5 * S, "#6f9a55", 1);
  }
  crew.forEach(c => c.update(dt)); crew.slice().sort((a, b) => a.kind === "chick").forEach(c => c.draw(t));
  nextRun -= dt;
  if (!runner && nextRun <= 0) { runner = { x: -20, ph: 0 }; crew.forEach(c => { if (c.state !== "sleep") c.alert = 1.2; }); }
  if (runner) {
    runner.x += 110 * S * dt; runner.ph += dt * 16;
    if (Math.random() < dt * 20) dust.push({ x: runner.x - 4 * S, y: G - 1, a: 1, r: rnd(2, 4) * S });
    runnerDraw(runner);
    if (runner.x > W + 20) { runner = null; nextRun = rnd(25, 45); }
  }
  dust = dust.filter(d => (d.a -= dt * 1.6) > 0);
  dust.forEach(d => { g.globalAlpha = d.a * .6; dot(d.x - (1 - d.a) * 8, d.y - (1 - d.a) * 5, d.r * (1.5 - d.a * .5), "#e6d9bd"); g.globalAlpha = 1; });
  grass(t);
  hearts = hearts.filter(h => (h.a -= dt * .6) > 0);
  hearts.forEach(h => { h.y -= dt * 12; g.globalAlpha = h.a; g.font = `${14 * S}px serif`; g.fillStyle = "#e39b94"; g.fillText("♥", h.x - 5 * S, h.y); g.globalAlpha = 1; });
  requestAnimationFrame(loop);
}
resize();
crew = [new Critter("cat", 14), new Critter("rabbit", 18), new Critter("chick", 9)];
addEventListener("resize", resize);
requestAnimationFrame(loop);
</script>
</body>
</html>
